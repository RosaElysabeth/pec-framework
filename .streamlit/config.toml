[server]
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#2e86c1"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f8ff"
textColor = "#1a1a2e"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"